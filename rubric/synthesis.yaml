# Bayesify rubric — draft v0.1
# Source of truth for the Phase-2 engine (compiled into prompts + deterministic checks) and the
# Phase-3 corpus scoring. Grounded in research/bayesian-workflow-gold-standards.md (deep-research
# synthesis, 2026-06-10). Every threshold is attributed to its source; do NOT collapse to one number.
#
# applicability gating: paper_class labels from PaperClassLabel
#   essential_for: classes where the step is tier-1 "expected" (missing => error-severity finding)
#   recommended_for: classes where it is tier-2 "recommended" (missing => warning/info)
#   na_when: conditions making the step legitimately not-applicable (excluded from denominator)
# status values emitted by the engine: adequate | partial | missing | not_applicable
# CAUTION: two scope gaps remain before v1.0 — see steps S4 (modern R-hat/ESS) and S6 (LOO/WAIC).
# PROFILES (2026-06-12, PR-#1): assessment is conditioned on a rubric profile — `synthesis`
#   (this whole file; the default, to be developed into the gold standard) or a source-pure
#   profile compiled by filtering steps/thresholds on `citations` provenance (first: `schad2021`).

rubric_version: "0.1-draft"
label: "Synthesis (merged gold standard)"
summary: >
  The default Bayesify rubric: a merged, provenance-tracked standard drawing on the major
  Bayesian-workflow sources (Gelman 2020, Schad 2021, BARG, WAMBS, Vehtari R-hat/LOO, Betancourt,
  and more). Each step is grounded in one or more of those sources, so the report cites the specific
  standard applied per step. Ten steps spanning model specification through reporting.
status_values: [adequate, partial, missing, not_applicable]
scoring_rule: >
  (2026-06-12 decision — no categorical badge.) Primary output = per-step profile.
  coverage = present/applicable where present = adequate|partial, reported as a
  strict-lenient range when absences are low-confidence (a low-confidence absence
  MUST NOT alone lower the headline number). quality = weighted mean sub-score over
  applicable steps. essential_for now sets expectation tier (severity), not a verdict.
  The machine-evaluable scoring block + applicability gates below are the G5 half
  (M5); weights are a uniform v0 placeholder (B3 v1 differentiates them).

# G5 scoring block — the machine half f-score (core/score.py) reads; nothing hardcoded.
scoring:
  sub_score: { adequate: 1.0, partial: 0.5, missing: 0.0 }   # not_applicable is excluded
  low_confidence_threshold: 0.6   # an absence below this confidence is "uncertain" (widens the range)
  weight_default: 1.0
  weights:                # per-class step-weight overrides; omitted steps use weight_default.
    data_analysis: {}         # v0: uniform weights — a documented placeholder (B3 v1 differentiates).
    numerical_analysis: {}
    model_development: {}
    method_development: {}
    software_development: {}
    theoretical_analysis: {}
  mixing_rule: max        # multi-label papers use the maximum weight across selected labels.

steps:
  - id: S1
    name: Model specification & justification
    essential_for: [data_analysis, numerical_analysis, model_development, method_development, software_development, theoretical_analysis]
    why: "The generative model is the foundation every later check is run against — an unstated or unjustified model makes every downstream diagnostic uninterpretable."
    adequate: "Explicit generative/likelihood model; assumptions stated; structure justified by question/data."
    missing: "Model appears with no rationale; key assumptions unstated."
    citations: [gelman2020, schad2021]

  - id: S2
    name: Prior specification
    essential_for: [data_analysis, numerical_analysis, model_development, method_development, software_development, theoretical_analysis]
    # v0: S2 is always applicable (no na_when) — priors are always expected to be reported, so the
    # engine and a blind rater gate it identically. The immaterial-priors nuance is a `note`, not an
    # N/A path; depth of justification may be relaxed there, but reporting is still required.
    why: "Priors are part of the model and shape the posterior; leaving them unstated hides assumptions and makes the analysis impossible to reproduce or critique."
    note: "When the likelihood fully dominates and priors are immaterial, the depth of justification may be relaxed — but the priors must still be reported (silence remains a defect)."
    adequate: "Every prior listed and justified (weakly-informative vs informative, and why); informative priors sourced."
    missing: "'Default priors' with no statement of what they are; priors absent; unexamined flat priors."
    citations: [barg2021, wambs2017, vandeschoot2021]

  - id: S3
    name: Prior predictive / prior pushforward checks
    essential_for: [model_development, method_development, software_development, theoretical_analysis]
    recommended_for: [data_analysis, numerical_analysis]
    why: "Simulating from the prior before seeing data catches implausible assumptions while they are still cheap to fix, and before the data can bias the prior choice."
    adequate: "Simulations from prior(+likelihood) shown/described BEFORE data; implausible implications caught & priors revised."
    missing: "No prior predictive reasoning; priors never sanity-checked; priors set from the data (uses data twice)."
    citations: [gabry2019, betancourt_workflow, schad2021]

  - id: S4
    name: Computational faithfulness
    essential_for: [data_analysis, numerical_analysis, model_development, method_development, software_development, theoretical_analysis]
    na_when: "Exact/analytic/conjugate posterior — no sampler. Mark not_applicable, do not penalize."
    gate:
      na_when_inference: [exact_analytic]   # no sampler to diagnose → not_applicable (G6)
    inference_scope: [mcmc, hmc_nuts, variational]
    why: "Convergence diagnostics tell you whether the sampler actually approximated the posterior; without them, every number reported could be an artifact of a broken fit."
    adequate: "Reports R-hat AND ESS for every parameter (BARG); divergences=0; warmup/iters/chains stated; treedepth/E-FMI/MCSE as relevant."
    missing: "No convergence diagnostics; single chain; ignored divergences; only one of R-hat/ESS."
    thresholds:
      rhat_modern: { value: "< 1.01", source: vehtari2021, verified: false, note: "fetched but not adversarially verified this run; cite directly. 2026 pass line." }
      rhat_historical: { value: "> 1.1 flagged", source: betancourt_workflow, verified: true, note: "stan_utility; use to judge older papers in context." }
      ess_neff_ratio: { value: "n_eff/iter < 0.001 flagged", source: betancourt_workflow, verified: true }
      ess_hdi: { value: ">= 10000 for stable HDI limits", source: barg2021, verified: true, note: "lower OK for equal-tailed intervals." }
      ess_bulk_tail: { value: "> 400", source: vehtari2021, verified: false, note: "cite directly; not verified this run." }
      divergences: { value: "count > 0 flagged", source: betancourt_workflow, verified: true }
      efmi: { value: "< 0.2 flagged", source: betancourt_workflow, verified: true }
      treedepth: { value: "max-treedepth saturation flagged", source: betancourt_workflow, verified: true }
      doubling_rule: { value: "relative bias > |5|% -> rerun 4x iters", source: wambs2017, verified: true }
    citations: [betancourt_workflow, barg2021, wambs2017, vehtari2021]

  - id: S5
    name: Posterior predictive (retrodictive) checks
    essential_for: [data_analysis]
    recommended_for: [numerical_analysis, model_development, method_development, software_development, theoretical_analysis]
    why: "Comparing the fitted model's predictions back to the observed data is the main test of whether the model is actually adequate for the question."
    adequate: "PPCs shown (graphical overlays and/or test quantities); discrepancies discussed and acted on."
    missing: "No PPC; fit asserted without checking; obvious misfit ignored."
    note: "PPC discrepancies are signals to investigate, NOT auto-diagnoses of a specific defect."
    citations: [gabry2019, gelman2020]

  - id: S6
    name: Model comparison / selection
    na_when: "Only one model entertained and no Bayes factor reported."
    essential_for: []   # conditionally essential only when >=2 models or a BF is claimed
    gate:               # G6: model comparison is N/A for a single model w/o BF, else expected
      na_when_single_model_no_bf: true
      essential_when_models_gte: 2
      essential_when_bf_claimed: true
    why: "When more than one model is in play, an honest comparison carrying uncertainty prevents cherry-picking the specification that merely happened to look best."
    adequate: "PSIS-LOO/WAIC with SE and Pareto-k reported, interpreted with uncertainty. For BF: robust BF sub-workflow (verify priors, bridge-sample >=2x, SBC-check BF accuracy)."
    missing: "Model chosen with no comparison / inappropriate criterion; high Pareto-k ignored; BF reported without prior justification, stability, or SBC."
    thresholds:
      pareto_k: { value: "k>0.5 monitor, k>0.7 bad", source: vehtari2017, verified: false, note: "SCOPE GAP: widely used but NOT verified this run. Fill from Vehtari 2017 + Stan loo docs before v1.0." }
      elpd_diff: { value: "report elpd differences WITH standard errors", source: vehtari2017, verified: false }
    requires: [S8]   # BF claims make prior sensitivity mandatory
    citations: [vehtari2017, schad2022_bf]

  - id: S7
    name: Simulation-based calibration
    essential_for: [model_development, method_development, software_development, theoretical_analysis, numerical_analysis]
    recommended_for: [data_analysis]
    na_when: "Routine fit with reliable self-diagnostics (S4) on a simple/standard model — may be done once per research program."
    why: "Calibration / recovery studies show the inference machinery itself is trustworthy on this model — essential for a new method, before any real-data claim is believed."
    adequate: "SBC (rank-uniformity) or parameter-recovery study reported; for BF, SBC of BF estimates."
    missing: "New method/model with no recovery or calibration evidence."
    citations: [talts2018, modrak2023, schad2022_bf]

  - id: S8
    name: Prior / model sensitivity analysis
    essential_for: [model_development, method_development, software_development, theoretical_analysis]
    recommended_for: [data_analysis, numerical_analysis]
    na_when: "Likelihood clearly dominates and priors are immaterial AND no BF/informative prior used."
    mandatory_when: "Informative/weakly-informative priors used, OR any Bayes-factor claim (WAMBS; Schad 2022)."
    gate:               # G6: informative priors or a BF claim escalate S8 to expected (any class)
      essential_when_prior_informative: true
      essential_when_bf_claimed: true
    why: "Checking whether conclusions survive reasonable changes to the priors/specification distinguishes a robust finding from an artifact of one arbitrary choice."
    adequate: "Alternative priors/specifications tried; robustness (or lack of) reported regardless of outcome."
    missing: "Single specification; no sensitivity check despite influential priors/BF."
    citations: [wambs2017, vandeschoot2021, gelman2020, schad2022_bf]

  - id: S9
    name: Reporting & reproducibility
    essential_for: [data_analysis, numerical_analysis, model_development, method_development, software_development, theoretical_analysis]
    why: "A Bayesian result is only usable if others can see and rerun the model, priors, settings, and data — opacity makes the analysis impossible to verify or build on."
    adequate: "Model, priors, software+version, sampler settings (chains/iters/warmup/seed), diagnostics, data/code availability all reported (BARG 6 steps)."
    missing: "Opaque 'we fit a Bayesian model'; missing settings; point estimates with no uncertainty; no data/code."
    citations: [barg2021, wambs2017]

  - id: S10
    name: Posterior summary & inference communication
    essential_for: [data_analysis, numerical_analysis, model_development, method_development, software_development, theoretical_analysis]
    why: "How the posterior is summarized and claimed is where the analysis meets the science — dropping uncertainty or over-claiming undoes the careful work upstream."
    adequate: "Point + interval (CrI/HDI, defined) with uncertainty; claims tied to posterior quantities; no over-claiming."
    missing: "Point estimates only; significance-style misreadings; intervals undefined."
    citations: [barg2021, vandeschoot2021]

citations:
  gelman2020:        "Gelman et al. 2020. Bayesian Workflow. arXiv:2011.01808."
  betancourt_workflow: "Betancourt. Towards a Principled Bayesian Workflow (case study)."
  schad2021:         "Schad, Betancourt & Vasishth 2021. Psychological Methods 26(1). arXiv:1904.12765."
  schad2022_bf:      "Schad et al. 2022. Workflow for Bayes factors (SBC). arXiv:2103.08744."
  barg2021:          "Kruschke 2021. Bayesian Analysis Reporting Guidelines. Nat Hum Behav 5:1282. doi:10.1038/s41562-021-01177-7."
  wambs2017:         "Depaoli & van de Schoot 2017 (WAMBS) + van de Schoot et al. WAMBS-v2. doi:10.4324/9780429273872-4."
  vandeschoot2021:   "van de Schoot et al. 2021. Bayesian statistics and modelling. Nat Rev Methods Primers. doi:10.1038/s43586-020-00001-2."
  vehtari2021:       "Vehtari, Gelman, Simpson, Carpenter & Bürkner 2021. Improved R-hat. Bayesian Analysis 16(2):667. [thresholds to confirm]"
  vehtari2017:       "Vehtari, Gelman & Gabry 2017. Practical Bayesian model evaluation (LOO/WAIC). Stat Comput 27:1413. [LOO/Pareto-k to confirm]"
  gabry2019:         "Gabry, Simpson, Vehtari, Betancourt & Gelman 2019. Visualization in Bayesian workflow. JRSS-A. doi:10.1111/rssa.12378."
  talts2018:         "Talts, Betancourt, Simpson, Vehtari & Gelman 2018. Validating Bayesian inference with SBC. arXiv:1804.06788."
  modrak2023:        "Modrák et al. 2023. SBC Checking. Bayesian Analysis."
