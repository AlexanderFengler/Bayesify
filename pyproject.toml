[project]
name = "veribayes"
version = "0.1.0"
description = "Assess how well academic papers follow Bayesian-workflow best practices."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "import-linter>=2.0",
    "httpx>=0.27",  # FastAPI TestClient transport
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",  # multipart upload
    "sse-starlette>=2.0",        # SSE progress stream
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veribayes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The M1 stub engine is hand-authored prose fixture data; long readable strings are fine there.
"veribayes/core/stub.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are designed to be called in argument defaults (not a B008 smell).
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Path", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# --- Architectural seam (review gate, plans 02 §3.2): veribayes.core must stay web-free ---
# core depends only on stdlib + pydantic + pyyaml (+ httpx later for the fetcher). It must never
# import the FastAPI app or any web framework, so Phase 3's batch pipeline can import it unchanged.
[tool.importlinter]
root_package = "veribayes"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is web-free"
type = "forbidden"
source_modules = ["veribayes.core"]
forbidden_modules = ["veribayes.api", "fastapi", "starlette", "uvicorn"]

# --- Environment management (pixi, conda-forge) ---------------------------------------------------
# Reproducible environments + lockfile. `pixi install` provisions Python 3.12; `pixi run check`
# runs lint + import-contract + tests. Runtime deps come from [project.dependencies] and dev tools
# from the [project.optional-dependencies].dev group (pixi exposes it as the `dev` feature).
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
nodejs = "22.*"  # frontend toolchain (web/), pixi-managed for reproducibility

[tool.pixi.pypi-dependencies]
veribayes = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev", "api"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest -q"
lint = "ruff check veribayes tests"
fmt = "ruff format veribayes tests"
imports = "lint-imports"
check = { depends-on = ["lint", "imports", "test"] }
# --- App (M1 stub: real flow, stub engine) ---
api = "uvicorn veribayes.api.app:app --reload --port 8000"
setup-web = { cmd = "npm install", cwd = "web" }
web = { cmd = "npm run dev", cwd = "web" }
web-build = { cmd = "npm run build", cwd = "web" }
web-typecheck = { cmd = "npm run typecheck", cwd = "web" }
