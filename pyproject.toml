[project]
name = "bayesify"
version = "0.1.0"
description = "Assess how well academic papers follow Bayesian-workflow best practices."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",  # the OA-provider fetcher (core stays web-free: httpx is allowed, FastAPI is not)
    "anthropic>=0.40",  # the LLM stages (screen/classify/assess); imported lazily in core.llm
    "claude-agent-sdk>=0.1.0",  # optional LLM backend: run on a Claude subscription (no API key)
    "openai>=1.80",  # optional LLM backend: OpenAI Responses API
    "pymongo>=4.10",  # MongoDB report persistence client
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "import-linter>=2.0",
    "hypothesis>=6.0",  # property tests for the f-score invariants (N/A-never-penalizes, monotonic, …)
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",  # multipart upload
    "sse-starlette>=2.0",        # SSE progress stream
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bayesify"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The M1 stub engine is hand-authored prose fixture data; long readable strings are fine there.
"bayesify/core/stub.py" = ["E501"]
# The detector catalog is regex-pattern data (the C1 review surface); patterns read best unwrapped.
"bayesify/core/detectors/catalog.py" = ["E501"]
# The fixture generators are hand-authored prose (sample paper text); long readable strings are fine.
"tests/fixtures/*.py" = ["E501"]
# The prompt set is LLM prompt-text data (the G1 review surface); prompts read best unwrapped.
"bayesify/core/prompts.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are designed to be called in argument defaults (not a B008 smell).
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Path", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# --- Architectural seam (review gate, plans 02 §3.2): bayesify.core must stay web-free ---
# core depends only on stdlib + pydantic + pyyaml (+ httpx later for the fetcher). It must never
# import the FastAPI app or any web framework, so Phase 3's batch pipeline can import it unchanged.
[tool.importlinter]
root_package = "bayesify"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is web-free"
type = "forbidden"
source_modules = ["bayesify.core"]
forbidden_modules = ["bayesify.api", "fastapi", "starlette", "uvicorn"]

# f-score is a pure, deterministic function (f-score.md DoD): no LLM, no network, no IO.
[[tool.importlinter.contracts]]
name = "score is pure"
type = "forbidden"
source_modules = ["bayesify.core.score"]
forbidden_modules = ["bayesify.core.llm", "bayesify.llm", "anthropic", "claude_agent_sdk", "openai", "httpx"]

# The human-report contract is the measuring instrument: it must not depend on engine *behaviour*,
# so the instrument can never inherit the engine's framing (the validity firewall). It shares only
# the schema vocabulary (enums/EvidenceSpan/GateFacts); the no-ScoredResult/StepAssessment guarantee
# (class-level, not expressible here) is asserted by tests/test_human_report.py.
[[tool.importlinter.contracts]]
name = "human-report contract is engine-free"
type = "forbidden"
source_modules = ["bayesify.core.validation.human_report"]
forbidden_modules = [
    "bayesify.core.score",
    "bayesify.core.assess",
    "bayesify.core.screen",
    "bayesify.core.classify",
    "bayesify.core.pipeline",
    "bayesify.core.llm",
    "bayesify.llm",
]

# The metric engine is pure (same discipline as score): no LLM, no network, no IO — just labels in,
# statistics out. Deterministic (the bootstrap is seeded).
[[tool.importlinter.contracts]]
name = "validation metrics is pure"
type = "forbidden"
source_modules = ["bayesify.core.validation.metrics"]
forbidden_modules = [
    "bayesify.core.llm",
    "bayesify.llm",
    "bayesify.api",
    "anthropic",
    "claude_agent_sdk",
    "openai",
    "httpx",
]

# --- Environment management (pixi, conda-forge) ---------------------------------------------------
# Reproducible environments + lockfile. `pixi install` provisions Python 3.12; `pixi run check`
# runs lint + import-contract + tests. Runtime deps come from [project.dependencies] and dev tools
# from the [project.optional-dependencies].dev group (pixi exposes it as the `dev` feature).
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
nodejs = "22.*"  # frontend toolchain (web/), pixi-managed for reproducibility
# PyMuPDF is the light, deterministic parser (component b fallback, no torch). It lives in the base
# env — not the heavy `parse` feature — so the running API (`pixi run api`) can parse PDFs for the
# local-only detection mode out of the box. Docling (richer, heavier) stays an opt-in upgrade below.
pymupdf = ">=1.24"

[tool.pixi.pypi-dependencies]
bayesify = { path = ".", editable = true }

# Heavy parser dep (component b) — conda-forge, not pypi: conda builds carry correct platform tags,
# avoiding the locally-built-wheel macOS-version mismatch. Only installed in the `parse` environment,
# so the default env (and CI) stays light. torch + models land in gitignored .pixi; nothing big is
# committed (the lockfile grows, but it's text). PyMuPDF is in the base env (above), not here.
# Docling's conda dependency chain does not currently solve on win-64, so the richer parser feature
# is Linux/macOS-only. Windows still gets the base PyMuPDF parser in the default environment.
[tool.pixi.feature.parse]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.feature.parse.dependencies]
docling = ">=2.0"   # richer parser upgrade: layout / sections / tables / captions

[tool.pixi.environments]
default = { features = ["dev", "api"] }
# The heavy parser env — install/run with `pixi run -e parse <task>`. Not installed by a plain
# `pixi install`, so the default workflow stays light.
parse = { features = ["dev", "api", "parse"] }

[tool.pixi.tasks]
test = "pytest -q"
lint = "ruff check bayesify tests"
fmt = "ruff format bayesify tests"
imports = "lint-imports"
check = { depends-on = ["lint", "imports", "test"] }
test-parse = "pytest tests/test_parse.py -v"  # run with: pixi run -e parse test-parse
# Live screen/classify accuracy gates over the labeled fixture set. Needs ANTHROPIC_API_KEY and makes
# real (paid) cheap-model calls; opt-in via this task's env so it never fires during `pixi run check`.
eval = { cmd = "pytest tests/eval -v", env = { BAYESIFY_RUN_EVAL = "1" } }
# Validation harness (component h). `validate` runs the demo dry-run over the committed fake goldset
# (offline, no LLM) and writes VALIDATION.demo.md; `demo-data` regenerates the fake goldset.
validate = "python -m bayesify.core.validation.harness"
demo-data = "python -m bayesify.core.validation.demo_data"
# Group captured blind ratings (durable store) into gold records (auto-consensus) -> validation/goldset/.
assemble-goldset = "python -m bayesify.core.validation.assemble"
# --- App ---
# One-process run (recommended): builds the UI and serves it + the API on one port (http://localhost:8000).
# Run `pixi run setup-web` once first (installs node_modules).
app = { cmd = "uvicorn bayesify.api.app:app --port 8000", depends-on = ["web-build"] }
# Hot-reload dev: run `pixi run api` and, in another terminal, `pixi run web` (Vite on :5173 proxies
# /api to :8000 and hot-reloads the UI). The static mount is absent here (web/dist need not exist).
api = "uvicorn bayesify.api.app:app --reload --port 8000"
setup-web = { cmd = "npm install", cwd = "web" }
web = { cmd = "npm run dev", cwd = "web" }
web-build = { cmd = "npm run build", cwd = "web" }
web-typecheck = { cmd = "npm run typecheck", cwd = "web" }
